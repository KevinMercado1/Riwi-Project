name: riwi_project

services:
  postgres:
    image: postgres:16
    container_name: riwi_postgres
    restart: always

    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}

    ports:
      - '5433:5432'

    volumes:
      - riwi_project_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: riwi_backend
    restart: always

    ports:
      - '{PORT}:{PORT}'

    environment:
      NODE_ENV: development
      PORT: 3000

      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432

      JWT_SECRET: ${JWT_SECRET}

    volumes:
      - ./src:/app/src

    depends_on:
      - postgres

volumes:
  riwi_project_data:
