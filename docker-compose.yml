name: riwi_project

services:
  postgres:
    image: postgres:16
    container_name: riwi_project
    restart: always
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - '5433:5432'
    volumes:
      - riwi_project_data:/var/lib/postgresql/data

volumes:
  riwi_project_data:
